  </text>

  <!-- Bottom stats strip -->
  <rect x="0" y="555" width="1200" height="75" fill="#2563eb" opacity="0.05" />
  <text x="80" y="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2563eb">
